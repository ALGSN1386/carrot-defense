<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>保卫萝卜 · 网页版 V3.0</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>🥕 保卫萝卜</h1>
      <div class="hud">
        <span class="stat">❤️ <b id="hud-life">20</b></span>
        <span class="stat">🪙 <b id="hud-coins">320</b></span>
        <span class="stat">🌊 <b id="hud-wave">0/15</b></span>
        <span class="stat timer" id="hud-timer">下一波 12s</span>
      </div>
      <div class="controls">
        <div class="speed" id="speed-btns">
          <button data-speed="1" class="active">1×</button>
          <button data-speed="2">2×</button>
          <button data-speed="3">3×</button>
        </div>
        <button id="start-wave">立即开战</button>
        <button id="pause-btn">暂停</button>
        <button id="restart-btn">重开</button>
      </div>
    </header>

    <main class="stage">
      <canvas id="game"></canvas>
      <div id="flash" class="flash"></div>
      <div id="overlay" class="overlay hidden">
        <div class="overlay-card">
          <h2 id="overlay-text">通关！</h2>
          <p id="overlay-stats"></p>
          <button id="overlay-restart">再来一局</button>
        </div>
      </div>
    </main>

    <footer class="shopbar">
      <div id="shop" class="shop"></div>
      <div id="selected-panel" class="selected-panel hidden"></div>
    </footer>
  </div>

  <script type="module" src="js/ui.js"></script>
  <script>
    // 覆盖层“再来一局”绑定（ui.js 内 restart 已定义，这里桥接）
    window.addEventListener('DOMContentLoaded', () => {
      const ov = document.getElementById('overlay-restart');
      if (ov) ov.addEventListener('click', () => document.getElementById('restart-btn').click());
    });
  </script>
</body>
</html>
