<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>保卫萝卜 · 网页塔防</title>
<meta name="description" content="打开即玩的网页塔防：5 种塔、15 波、零依赖、无账号。" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<main class="app">
  <header class="hud">
    <div class="hud-group">
      <div class="brand">保卫萝卜</div>
      <div class="hp">
        <span class="hp-num" id="hpText">20</span>
        <div class="hp-track"><i id="hpFill" class="ok"></i></div>
      </div>
    </div>

    <div class="hud-group stats">
      <div class="stat"><label>金币</label><b id="coins">320</b></div>
      <div class="stat"><label>波次</label><b id="wave">0/15</b></div>
    </div>

    <div class="hud-group actions">
      <button id="startBtn" class="primary">立即开战</button>
      <button id="pauseBtn">暂停</button>
      <button id="speedBtn">1×</button>
      <button id="muteBtn" class="ghost">声音</button>
      <button id="restartBtn" class="ghost">重开</button>
    </div>
  </header>

  <div class="stage">
    <canvas id="board" aria-label="游戏画面"></canvas>
    <div id="banner" class="banner"></div>
    <div id="overlay" class="overlay" hidden>
      <div class="panel">
        <h2 id="overlayTitle">守住了！</h2>
        <p id="overlayText"></p>
        <button id="againBtn" class="primary">再来一局</button>
      </div>
    </div>
  </div>

  <div id="nextWave" class="nextwave"></div>

  <section class="shop" id="shop" aria-label="防御塔"></section>

  <section class="inspect" id="inspect">
    <div id="inspectBody"><span class="hint">选中一座塔查看数值，或点左侧塔卡建造新的塔</span></div>
  </section>

  <p class="tip">点塔卡 → 点草地建造　·　点塔可升级 / 拆除　·　空格开波　·　1–5 选塔　·　P 暂停</p>
</main>
<div id="toast" class="toast"></div>
<script type="module" src="js/ui.js"></script>
</body>
</html>
